version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  # Base images only; Kafka versions are maintained by hand in kafka-versions.json.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # Keeps eclipse-temurin on Java 21 until it is checked against every Kafka version built.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
