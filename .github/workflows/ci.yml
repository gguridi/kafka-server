name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  DOCKERHUB_IMAGE: gguridi/kafka
  SCALA_VERSION: "2.13"

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.read.outputs.all }}
      latest: ${{ steps.read.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          echo "all=$(jq -c . kafka-versions.json)" >> "$GITHUB_OUTPUT"
          echo "latest=$(jq -r 'last' kafka-versions.json)" >> "$GITHUB_OUTPUT"

  test:
    name: test (kafka ${{ matrix.kafka_version }})
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kafka_version: ${{ fromJSON(needs.versions.outputs.all) }}
    env:
      KAFKA_IMAGE: kafka-test:${{ matrix.kafka_version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.KAFKA_IMAGE }}
          build-args: |
            SCALA_VERSION=${{ env.SCALA_VERSION }}
            KAFKA_VERSION=${{ matrix.kafka_version }}
          cache-from: type=gha,scope=kafka-${{ matrix.kafka_version }}
          cache-to: type=gha,mode=max,scope=kafka-${{ matrix.kafka_version }}
      - name: Start Kafka
        run: |
          npm run docker:run
          timeout 120 npm run docker:wait
      - run: npm test
      - name: Kafka logs
        if: failure()
        run: docker logs kafka-local

  publish:
    name: publish (kafka ${{ matrix.kafka_version }})
    needs: [versions, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        kafka_version: ${{ fromJSON(needs.versions.outputs.all) }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          KAFKA_VERSION: ${{ matrix.kafka_version }}
        run: echo "minor=${KAFKA_VERSION%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/kafka
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.SCALA_VERSION }}-${{ matrix.kafka_version }}
            type=raw,value=${{ matrix.kafka_version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=latest,enable=${{ matrix.kafka_version == needs.versions.outputs.latest }}
          labels: |
            org.opencontainers.image.version=${{ matrix.kafka_version }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SCALA_VERSION=${{ env.SCALA_VERSION }}
            KAFKA_VERSION=${{ matrix.kafka_version }}
          cache-from: type=gha,scope=kafka-${{ matrix.kafka_version }}
          provenance: mode=max
          sbom: true

  dockerhub-description:
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: Single-node Apache Kafka (KRaft) images for development and testing
